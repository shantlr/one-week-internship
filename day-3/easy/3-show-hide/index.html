<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show/Hide</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        Exercise: Show/Hide Toggle

        Create a button that toggles visibility of content.

        Requirements:
        - Button that shows/hides content
        - Button text changes: "Show" / "Hide"
        - Bonus: Add smooth fade animation
        - Bonus: Multiple collapsible sections
    -->

    <div class="container">
        <h1>Show/Hide Toggle</h1>

        <div class="section">
            <button class="toggle-btn">Hide Content</button>
            <div class="content">
                <p>This is some content that can be shown or hidden.</p>
                <p>Click the button above to toggle visibility.</p>
            </div>
        </div>

        <div class="section">
            <button class="toggle-btn">Hide Content</button>
            <div class="content">
                <p>This is another section with different content.</p>
                <p>Each section works independently.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
