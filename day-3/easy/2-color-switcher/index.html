<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Switcher</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        Exercise: Color Switcher

        Create buttons that change the page background color.

        Requirements:
        - Multiple color buttons (red, green, blue, etc.)
        - Clicking a button changes body background
        - Bonus: Add a random color button
        - Bonus: Display current color code
    -->

    <div class="container">
        <h1>Color Switcher</h1>
        <p id="color-code">#f0f0f0</p>
        <div class="buttons">
            <button class="color-btn" data-color="#e74c3c">Red</button>
            <button class="color-btn" data-color="#2ecc71">Green</button>
            <button class="color-btn" data-color="#3498db">Blue</button>
            <button class="color-btn" data-color="#9b59b6">Purple</button>
            <button class="color-btn" data-color="#f39c12">Orange</button>
            <button id="random-btn">Random</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
