<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--
        Exercise: Click Counter

        Create a button that counts how many times it's been clicked.
        Display the count on screen.

        Requirements:
        - Show current count (starts at 0)
        - Button that increments count when clicked
        - Bonus: Add a reset button
        - Bonus: Change color when count > 10
    -->

    <div class="container">
        <h1>Click Counter</h1>
        <p id="count">0</p>
        <button id="click-btn">Click Me!</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
