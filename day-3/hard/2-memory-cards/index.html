<body>
    <!--
        Exercise: Memory Cards

        Classic memory matching game.

        Requirements:
        - 4x4 grid of cards (8 pairs)
        - Cards start face down
        - Click to flip card
        - Match two cards = they stay up
        - No match = flip back after delay
        - Track moves and time
        - Win when all pairs found

        Bonus:
        - Shuffle cards on start
        - Best score tracking
        - Different themes
    -->

    <div id="app"></div>

    <script src="script.js"></script>
</body>
